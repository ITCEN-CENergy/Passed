name: AI CI

on:
  push:
    branches:
      - dev

    paths:
      - "passed-ai/**"
      - ".github/workflows/ai-ci.yml"

  pull_request:
    branches:
      - dev
      - main

    paths:
      - "passed-ai/**"
      - ".github/workflows/ai-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: passed-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "passed-ai/uv.lock"

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest