name: AI Deploy

on:
  push:
    branches:
      - main

    paths:
      - "passed-ai/**"
      - "infra/local/**"
      - ".github/workflows/ai-deploy.yml"

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build
        working-directory: passed-ai
        run: |
          chmod +x gradlew
          ./gradlew test bootJar

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/passed-ai:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/passed-ai:latest \
            backend

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/passed-ai:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/passed-ai:latest
  deploy:
    needs: build

    runs-on:
      - self-hosted
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        shell: powershell
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
          docker login ghcr.io `
            -u "${{ github.actor }}" `
            --password-stdin

      - name: Pull
        working-directory: infra/local
        run: docker compose pull ai

      - name: Deploy
        working-directory: infra/local
        run: docker compose up -d ai

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

          $response = Invoke-WebRequest `
            -Uri http://localhost:8000/health `
            -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            exit 1
          }
          