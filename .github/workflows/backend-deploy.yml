name: Backend Deploy

on:
  push:
    branches:
      - main

    paths:
      - "passed-backend/**"
      - "infra/local/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: passed-ai/requirements.txt

      - name: Install dependencies
        working-directory: passed-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/passed-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/passed-backend:latest \
            backend

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/passed-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/passed-backend:latest

  deploy:
    needs: build

    runs-on:
      - self-hosted
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        shell: powershell
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
          docker login ghcr.io `
            -u "${{ github.actor }}" `
            --password-stdin

      - name: Pull
        working-directory: infra/local
        run: docker compose pull ai

      - name: Deploy
        working-directory: infra/local
        run: docker compose up -d ai

      - name: Health check
        shell: powershell
        run: |
          $maxAttempts = 12
          $delaySeconds = 5
          $success = $false

          for ($i = 1; $i -le $maxAttempts; $i++) {

            Write-Host "Health check attempt $i/$maxAttempts"

            try {

              $response = Invoke-WebRequest `
                -Uri "http://localhost:8000/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {

                Write-Host "AI server is healthy."

                $success = $true

                break
              }

            }
            catch {

              Write-Host "AI server is not ready yet."

            }

            Start-Sleep -Seconds $delaySeconds
          }

          if (-not $success) {

            Write-Host "AI deployment health check failed."

            docker compose `
              -f infra/local/docker-compose.yml `
              logs `
              --tail 100 `
              ai

            exit 1
          }
          
      - name: Show container status
        if: always()
        working-directory: infra/local
        shell: powershell
        run: |
          docker compose ps