name: Frontend CI

on:
  push:
    branches:
      - dev

    paths:
      - "passed-frontend/**"

  pull_request:
    branches:
      - dev
      - main

    paths:
      - "passed-frontend/**"

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: passed-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: passed-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build