name: Frontend Deploy

on:
  push:
    branches:
      - main

    paths:
      - "passed-frontend/**"
      - ".github/workflows/frontend-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: passed-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: passed-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build