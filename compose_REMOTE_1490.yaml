services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    container_name: passed-postgres
    environment:
      POSTGRES_DB: edu
      POSTGRES_USER: 1234
      POSTGRES_PASSWORD: edudb
    ports:
      - "5432:5432"
    volumes:
      - passed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  passed-postgres-data:
