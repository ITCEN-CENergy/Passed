services:
  postgres:
    image: postgres:17 

    container_name: project-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: edu
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5433:5432"

volumes: 
  postgres-data: