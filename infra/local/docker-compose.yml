services:

  # =========================================================
  # Spring Boot Backend
  # =========================================================
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/itcen-cenergy/passed-backend:latest}
    container_name: passed-backend

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - passed-network


  # =========================================================
  # FastAPI / AI
  # =========================================================
  ai:
    image: ${AI_IMAGE:-ghcr.io/itcen-cenergy/passed-ai:latest}
    container_name: passed-ai

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"

    networks:
      - passed-network


  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: passed-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - passed-network


  # =========================================================
  # Postgres-Exporter
  # =========================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: passed-postgres-exporter

    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - passed-network


  # =========================================================
  # Prometheus
  # =========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: passed-prometheus

    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    networks:
      - passed-network


  # =========================================================
  # Grafana
  # =========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: passed-grafana

    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - passed-network


# =========================================================
# Networks
# =========================================================
networks:

  passed-network:
    name: passed-network
    driver: bridge


# =========================================================
# Persistent Volumes
# =========================================================
volumes:

  postgres-data:
    name: passed-postgres-data

  prometheus-data:
    name: passed-prometheus-data

  grafana-data:
    name: passed-grafana-data
