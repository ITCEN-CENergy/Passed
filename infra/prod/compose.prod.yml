name: passed-prod

services:
  # =========================================================
  # Spring Boot Backend
  # =========================================================
  backend:
    image: ghcr.io/itcen-cenergy/passed-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      # Container-to-container traffic uses Docker DNS and container ports.
      RECOMMENDATION_AI_BASE_URL: http://ai:8000
      ROADMAP_AI_BASE_URL: http://ai:8000
      COVER_LETTER_AI_BASE_URL: http://ai:8000
      USER_SKILL_AI_BASE_URL: http://ai:8000
      LEARNING_COMPETENCY_AI_BASE_URL: http://ai:8000

    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:18080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - passed-network


  # =========================================================
  # FastAPI / AI
  # =========================================================
  ai:
    image: ghcr.io/itcen-cenergy/passed-ai:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped

    environment:
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}

    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - passed-network


  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - passed-network


  
  # =========================================================
  # Postgres-Exporter
  # =========================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1

    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - passed-network


  # =========================================================
  # Prometheus
  # =========================================================
  prometheus:
    image: prom/prometheus:latest

    restart: unless-stopped

    ports:
      - "127.0.0.1:19090:9090"

    volumes:
      - ../prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    networks:
      - passed-network


  # =========================================================
  # Grafana
  # =========================================================
  grafana:
    image: grafana/grafana:latest

    restart: unless-stopped

    ports:
      - "127.0.0.1:13001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - passed-network


# =========================================================
# Networks
# =========================================================
networks:

  passed-network:
    driver: bridge


# =========================================================
# Persistent Volumes
# =========================================================
volumes:
  postgres-data:

  prometheus-data:

  grafana-data:
