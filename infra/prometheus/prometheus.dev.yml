global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: ai
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai:8000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: windows
    static_configs:
      - targets:
          - host.docker.internal:9182

  - job_name: oracle
    static_configs:
      - targets:
          - 100.79.186.37:9100
