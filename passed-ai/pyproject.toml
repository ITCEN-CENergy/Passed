    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
