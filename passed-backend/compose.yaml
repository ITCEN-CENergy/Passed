services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: edu
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: "1234"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - passed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  passed-postgres-data:
