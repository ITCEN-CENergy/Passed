spring:
  application:
    name: passed-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/edu}
    username: ${DB_USERNAME:edu}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

external:
  roadmap-ai:
    base-url: ${ROADMAP_AI_BASE_URL:http://localhost:8000}
    connect-timeout-millis: ${ROADMAP_AI_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${ROADMAP_AI_READ_TIMEOUT_MILLIS:420000}
  cover-letter-ai:
    base-url: ${COVER_LETTER_AI_BASE_URL:http://localhost:8000}
    connect-timeout-millis: ${COVER_LETTER_AI_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${COVER_LETTER_AI_READ_TIMEOUT_MILLIS:180000}

application:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 1800000
      refresh-token-expiration: 604800000
