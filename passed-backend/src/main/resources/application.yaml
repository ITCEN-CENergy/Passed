spring:
  application:
    name: passed-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/edu}
    username: ${DB_USERNAME:edu}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
